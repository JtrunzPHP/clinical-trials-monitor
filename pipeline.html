<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinical Pipelines: Plan vs Actual</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --navy:#1e1b4b; --accent:#4f46e5; --amber:#d97706; --red:#b91c1c; --green:#047857; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; }
  header { background:var(--navy); color:#fff; padding:16px 28px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:#a5b4fc; font-size:12px; }
  nav { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  nav button { background:transparent; color:#c7d2fe; border:1px solid #3730a3; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  nav button.on { background:#4f46e5; color:#fff; border-color:#4f46e5; }
  main { max-width:1320px; margin:0 auto; padding:20px 28px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input[type=search], select { padding:7px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; background:#fff; }
  .chip { display:inline-block; padding:3px 9px; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:12px; cursor:pointer; margin:2px; }
  .chip.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; background:#f9fafb; }
  td { padding:9px 12px; border-bottom:1px solid #f3f4f6; vertical-align:top; }
  tr.row:hover { background:#f5f3ff; cursor:pointer; }
  .tk { display:inline-block; font-family:ui-monospace,Menlo,monospace; font-weight:800; font-size:12px; padding:2px 8px; border-radius:6px; background:#e5e7eb; color:#374151; }
  .tk.cov { background:var(--navy); color:#a5b4fc; }
  .pill { display:inline-block; font-size:10px; font-weight:600; padding:2px 7px; border-radius:10px; margin-right:3px; white-space:nowrap; }
  .muted { color:var(--muted); font-size:12px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .score { font-weight:700; }
  .card { background:var(--card); border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:16px 18px; margin-bottom:14px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; }
  .stat { background:#f9fafb; border-radius:8px; padding:10px 14px; min-width:110px; text-align:center; }
  .stat b { display:block; font-size:20px; }
  .stat span { font-size:10px; color:var(--muted); }
  .trial { border-left:3px solid var(--line); padding:10px 14px; margin:8px 0; background:#fff; border-radius:0 8px 8px 0; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .trial .t { font-weight:600; margin-top:2px; }
  .trial .c { font-size:12px; color:#374151; margin-top:5px; line-height:1.45; }
  .trial .r { font-size:11px; color:var(--accent); margin-top:3px; }
  .sig { font-size:12px; margin-top:5px; padding:6px 8px; border-radius:6px; background:#f9fafb; }
  .sig.high { background:#fee2e2; } .sig.medium { background:#fef3c7; } .sig.low { background:#f3f4f6; } .sig.info { background:#ecfdf5; }
  .sig b { display:block; } .sig span { color:#4b5563; font-size:11px; }
  .pva { display:grid; grid-template-columns:auto 1fr 1fr 1fr; gap:2px 14px; font-size:12px; margin-top:8px; background:#f9fafb; padding:8px 10px; border-radius:6px; }
  .pva div.h { font-size:10px; text-transform:uppercase; color:var(--muted); letter-spacing:.3px; }
  .pva .d { color:#b91c1c; font-weight:600; } .pva .g { color:#047857; font-weight:600; }
  .tl { font-size:11px; color:#4b5563; margin-top:6px; }
  .tl span { display:inline-block; margin-right:10px; }
  .ch { font-size:11px; color:var(--red); margin-top:2px; } .ch.g { color:var(--green); }
  a { color:var(--accent); text-decoration:none; }
  h2 { font-size:15px; margin:18px 0 6px; }
  .back { display:inline-block; margin-bottom:10px; font-size:13px; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .cov { color:#9ca3af; font-size:11px; }
  @media (max-width:720px){ main{padding:12px;} th:nth-child(n+5), td:nth-child(n+5){display:none;} .pva{grid-template-columns:auto 1fr 1fr;} }
</style>
</head>
<body>
<header>
  <div><h1>Clinical Pipelines: Plan vs Actual</h1><div class="sub" id="sub">Loading...</div></div>
  <nav>
    <button data-v="deviations" class="on">Deviations</button>
    <button data-v="companies">Companies</button>
    <button data-v="readouts">Readouts (90d)</button>
    <button data-v="terminations">Terminations (12m)</button>
    <button data-v="candidates">Unmapped</button>
  </nav>
</header>
<main id="main"><div class="empty">Loading data...</div></main>

<script>
(function () {
  var DATA = "data/pipeline/";
  var IDX = null, view = "deviations", companyCache = {};
  var STATUS_COLOR = { "Terminated": "#ef4444", "Withdrawn": "#ef4444", "Suspended": "#f59e0b", "Completed": "#22c55e", "Active, not recruiting": "#22c55e", "Enrolling by invitation": "#3b82f6", "Recruiting": "#3b82f6", "Not yet recruiting": "#8b5cf6" };
  var KIND_LABEL = { pcd_slip: "Push-out", pcd_pull: "Pull-forward", start_slip: "Late start", not_started: "Not started", enroll_over: "Over-enrolled", enroll_under: "Under-enrolled", enroll_final: "Enrollment final", target_up: "Target raised", target_cut: "Target cut", endpoint: "Endpoint changed", results_overdue: "Results overdue", stopped: "Stopped" };
  var main = document.getElementById("main");

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function num(n) { return n == null ? "n/a" : Number(n).toLocaleString("en-US"); }
  function mon(s) { if (!s) return "n/a"; var m = /^(\d{4})-(\d{2})/.exec(s); if (!m) return s; return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2]-1] + " " + m[1]; }
  function tk(t, cov) { return '<span class="tk' + (cov ? ' cov' : '') + '">' + esc(t) + '</span>'; }
  function pill(text, color) { return '<span class="pill" style="background:' + color + '18;color:' + color + '">' + esc(text) + '</span>'; }
  function statusPill(label) { return pill(label, STATUS_COLOR[label] || "#6b7280"); }
  function devColor(s) { return s >= 60 ? "#b91c1c" : s >= 30 ? "#d97706" : "#6b7280"; }
  function sigPill(s) { var c = s.severity === "high" ? "#b91c1c" : s.severity === "medium" ? "#d97706" : s.severity === "info" ? "#047857" : "#6b7280"; return pill(KIND_LABEL[s.kind] || s.kind, c); }
  function isOngoing(r) { return /RECRUITING|ACTIVE_NOT_RECRUITING|ENROLLING_BY_INVITATION/.test(r.status); }
  function setView(v) { view = v; document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === v); }); }

  document.querySelectorAll("nav button").forEach(function (b) { b.onclick = function () { setView(b.dataset.v); location.hash = view; render(); }; });
  function render() {
    if (!IDX) return;
    if (view === "deviations") renderDeviations(); else if (view === "companies") renderCompanies(); else if (view === "readouts") renderReadouts(); else if (view === "terminations") renderTerminations(); else renderCandidates();
  }

  // ---------------- Deviations ----------------
  var dvKind = "", dvPhase = "", dvDays = "30", dvCov = false, dvQ = "";
  function renderDeviations() {
    var cutoff = new Date(Date.now() - (+dvDays) * 86400000).toISOString().substring(0, 10);
    var rows = IDX.deviations.filter(function (d) {
      if (dvDays !== "all" && (d.lastUpdate || "") < cutoff) return false;
      if (dvKind && !d.signals.some(function (s) { return s.kind === dvKind && s.severity !== "info"; })) return false;
      if (dvPhase === "3" && !/PHASE3/.test(d.phaseKey)) return false;
      if (dvPhase === "2" && !/PHASE2/.test(d.phaseKey)) return false;
      if (dvCov && !d.coverage) return false;
      if (dvQ && (d.ticker + " " + d.title + " " + d.intervention).toLowerCase().indexOf(dvQ.toLowerCase()) === -1) return false;
      return true;
    }).sort(function (a, b) { return b.deviation - a.deviation || (b.lastUpdate || "").localeCompare(a.lastUpdate || ""); });
    var h = '<div class="card"><b>Trials where the record has moved away from the sponsor\'s original plan</b><div class="muted">Each row compares today\'s CT.gov record with the version first registered (or with first-seen where history is still being collected). Score weights the number and severity of deviations, scaled up for Phase 3. History coverage: ' + IDX.stats.historyCoveragePct + '% of mapped trials.</div></div>';
    h += '<div class="toolbar"><input type="search" id="dq" placeholder="Ticker, title or drug" value="' + esc(dvQ) + '">';
    h += '<select id="dk"><option value="">All signal types</option>' + Object.keys(KIND_LABEL).filter(function (k) { return k !== "enroll_final"; }).map(function (k) { return '<option value="' + k + '"' + (dvKind === k ? ' selected' : '') + '>' + KIND_LABEL[k] + '</option>'; }).join("") + '</select>';
    h += '<select id="dp"><option value="">All phases</option><option value="3"' + (dvPhase === "3" ? ' selected' : '') + '>Phase 3</option><option value="2"' + (dvPhase === "2" ? ' selected' : '') + '>Phase 2</option></select>';
    h += '<select id="dd"><option value="7"' + (dvDays === "7" ? ' selected' : '') + '>Updated last 7 days</option><option value="30"' + (dvDays === "30" ? ' selected' : '') + '>Updated last 30 days</option><option value="90"' + (dvDays === "90" ? ' selected' : '') + '>Updated last 90 days</option><option value="all"' + (dvDays === "all" ? ' selected' : '') + '>Any time</option></select>';
    h += '<label class="muted"><input type="checkbox" id="dc"' + (dvCov ? ' checked' : '') + '> coverage only</label><span class="muted">' + rows.length + ' trials</span></div>';
    if (!rows.length) h += '<div class="empty">Nothing matches.</div>';
    rows.slice(0, 300).forEach(function (d) { h += devCard(d); });
    if (rows.length > 300) h += '<div class="muted" style="text-align:center;padding:10px">Showing 300 of ' + rows.length + '. Narrow the filters.</div>';
    main.innerHTML = h;
    var dq = document.getElementById("dq"); dq.oninput = function (e) { dvQ = e.target.value; renderDeviations(); var el = document.getElementById("dq"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
    document.getElementById("dk").onchange = function (e) { dvKind = e.target.value; renderDeviations(); };
    document.getElementById("dp").onchange = function (e) { dvPhase = e.target.value; renderDeviations(); };
    document.getElementById("dd").onchange = function (e) { dvDays = e.target.value; renderDeviations(); };
    document.getElementById("dc").onchange = function (e) { dvCov = e.target.checked; renderDeviations(); };
    main.querySelectorAll("[data-open]").forEach(function (el) { el.onclick = function (e) { e.preventDefault(); openCompany(el.dataset.open); }; });
  }
  function devCard(d) {
    var color = STATUS_COLOR[d.status] || "#6b7280";
    var h = '<div class="trial" style="border-left-color:' + devColor(d.deviation) + '">';
    h += '<div><a href="#" data-open="' + esc(d.ticker) + '">' + tk(d.ticker, d.coverage) + '</a> <a href="https://clinicaltrials.gov/study/' + esc(d.nct) + '" target="_blank" rel="noopener" style="font-family:ui-monospace,Menlo,monospace;font-weight:700">' + esc(d.nct) + '</a> ' + statusPill(d.status) + (d.phase ? pill(d.phase, "#6b7280") : "") + pill(d.area, "#7c3aed") + '<span class="score" style="float:right;color:' + devColor(d.deviation) + '">dev ' + d.deviation + ' <span class="muted">/ imp ' + d.importance + '</span></span></div>';
    h += '<div class="t">' + esc(d.title) + '</div><div class="muted">' + esc(d.intervention) + (d.conditions && d.conditions.length ? ' &middot; ' + esc(d.conditions.join(", ")) : '') + ' &middot; updated ' + esc(d.lastUpdate || "") + (d.historyPending ? ' &middot; <span class="cov">history pending, vs first seen</span>' : '') + '</div>';
    d.signals.filter(function (s) { return s.severity !== "info"; }).forEach(function (s) { h += '<div class="sig ' + s.severity + '">' + sigPill(s) + '<b>' + esc(s.text) + '</b><span>' + esc(s.read) + '</span>' + (s.detail ? '<div class="muted" style="margin-top:3px">Original: ' + esc(s.detail.original) + '<br>Current: ' + esc(s.detail.current) + '</div>' : '') + '</div>'; });
    if (d.changedToday && d.changedToday.length) h += '<div class="ch">Moved in the latest build: ' + esc(d.changedToday.join("; ")) + '</div>';
    h += '</div>';
    return h;
  }

  // ---------------- Companies ----------------
  var cSort = { key: "ongoing", dir: -1 }, cFilter = "", cSector = "";
  function renderCompanies() {
    var rows = IDX.companies.filter(function (c) { var q = cFilter.toLowerCase(); return (!q || c.ticker.toLowerCase().indexOf(q) !== -1 || (c.name || "").toLowerCase().indexOf(q) !== -1) && (!cSector || c.sector === cSector); });
    rows.sort(function (a, b) { var x = a[cSort.key], y = b[cSort.key]; if (x == null) x = cSort.dir < 0 ? -1 : "zzz"; if (y == null) y = cSort.dir < 0 ? -1 : "zzz"; return (x > y ? 1 : x < y ? -1 : 0) * cSort.dir || a.ticker.localeCompare(b.ticker); });
    var sectors = {}; IDX.companies.forEach(function (c) { sectors[c.sector] = 1; });
    var h = '<div class="toolbar"><input type="search" id="cq" placeholder="Search ticker or company" value="' + esc(cFilter) + '">';
    h += '<select id="cs"><option value="">All sectors</option>' + Object.keys(sectors).sort().map(function (s) { return '<option' + (s === cSector ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join("") + '</select>';
    h += '<span class="muted">' + rows.length + ' companies, ' + num(IDX.stats.mappedTrials) + ' trials mapped. "Slipped" = share of history-backed trials whose primary completion moved 3+ months past the original plan.</span></div>';
    h += '<table><thead><tr>' + [["ticker","Ticker"],["name","Company"],["ongoing","Ongoing"],["phase3","Ph 3"],["deviationCount","Flagged"],["topDeviation","Top dev"],["slippedPct","Slipped"],["avgSlipMonths","Avg slip mo"],["terminated12m","Stopped 12m"],["nextReadout","Next PCD"],["historyCoverage","Hist %"]].map(function (c) { return '<th data-k="' + c[0] + '">' + c[1] + (cSort.key === c[0] ? (cSort.dir < 0 ? ' &#9660;' : ' &#9650;') : '') + '</th>'; }).join("") + '</tr></thead><tbody>';
    rows.forEach(function (c) {
      var e = c.exec || {};
      h += '<tr class="row" data-t="' + esc(c.ticker) + '"><td>' + tk(c.ticker, c.coverage) + '</td><td>' + esc(c.name) + '<div class="muted">' + esc(c.sector) + '</div></td><td class="num">' + num(c.ongoing) + '</td><td class="num">' + num(c.phase3) + '</td><td class="num">' + num(c.deviationCount) + '</td><td class="num score" style="color:' + devColor(c.topDeviation) + '">' + c.topDeviation + '</td><td class="num">' + (e.slippedPct == null ? 'n/a' : e.slippedPct + '%') + '</td><td class="num">' + (e.avgSlipMonths == null ? 'n/a' : e.avgSlipMonths) + '</td><td class="num" style="color:' + (c.terminated12m ? '#b91c1c' : 'inherit') + '">' + num(c.terminated12m) + '</td><td>' + mon(c.nextReadout) + '</td><td class="num muted">' + c.historyCoverage + '%</td></tr>';
    });
    h += '</tbody></table>';
    main.innerHTML = h;
    document.getElementById("cq").oninput = function (e) { cFilter = e.target.value; renderCompanies(); var el = document.getElementById("cq"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
    document.getElementById("cs").onchange = function (e) { cSector = e.target.value; renderCompanies(); };
    main.querySelectorAll("th").forEach(function (th) { th.onclick = function () { var k = th.dataset.k; var execKeys = { slippedPct: 1, avgSlipMonths: 1 }; if (cSort.key === k) cSort.dir *= -1; else { cSort.key = k; cSort.dir = (k === "ticker" || k === "name" || k === "nextReadout") ? 1 : -1; } if (execKeys[k]) IDX.companies.forEach(function (c) { c[k] = c.exec ? c.exec[k] : null; }); renderCompanies(); }; });
    main.querySelectorAll("tr.row").forEach(function (tr) { tr.onclick = function () { openCompany(tr.dataset.t); }; });
  }

  // ---------------- Company detail ----------------
  var dArea = "", dPhase = "", dStatus = "ongoing", dSort = "deviation";
  function openCompany(ticker) {
    location.hash = "c/" + ticker;
    if (companyCache[ticker]) return renderCompany(companyCache[ticker]);
    main.innerHTML = '<div class="empty">Loading ' + esc(ticker) + '...</div>';
    fetch(DATA + "tickers/" + ticker + ".json").then(function (r) { return r.json(); }).then(function (d) { companyCache[ticker] = d; renderCompany(d); }).catch(function () { main.innerHTML = '<div class="empty">Could not load ' + esc(ticker) + '</div>'; });
  }
  function renderCompany(d) {
    var meta = IDX.companies.filter(function (c) { return c.ticker === d.ticker; })[0] || {};
    var all = d.trials, areas = {}; all.forEach(function (r) { areas[r.area] = (areas[r.area] || 0) + 1; });
    var rows = all.filter(function (r) {
      if (dStatus === "ongoing" && !isOngoing(r)) return false;
      if (dStatus === "closed" && isOngoing(r)) return false;
      if (dStatus === "terminated" && !/TERMINATED|SUSPENDED|WITHDRAWN/.test(r.status)) return false;
      if (dStatus === "flagged" && r.deviation < 30) return false;
      if (dArea && r.area !== dArea) return false;
      if (dPhase === "3" && !/PHASE3/.test(r.phaseKey)) return false;
      if (dPhase === "2" && !/PHASE2/.test(r.phaseKey)) return false;
      if (dPhase === "1" && !/PHASE1/.test(r.phaseKey)) return false;
      if (dPhase === "na" && r.phaseKey !== "NA") return false;
      return true;
    });
    if (dSort === "pcd") rows.sort(function (a, b) { return (a.pcd || "9999").localeCompare(b.pcd || "9999"); });
    else if (dSort === "changed") rows.sort(function (a, b) { return ((b.changes[0] || {}).date || "").localeCompare((a.changes[0] || {}).date || "") || b.deviation - a.deviation; });
    else if (dSort === "importance") rows.sort(function (a, b) { return b.importance - a.importance; });
    else rows.sort(function (a, b) { return b.deviation - a.deviation || b.importance - a.importance; });
    var e = meta.exec || {};
    var h = '<a class="back" href="#" id="back">&larr; All companies</a>';
    h += '<div class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">' + tk(d.ticker, meta.coverage) + '<b style="font-size:16px">' + esc(meta.name) + '</b><span class="muted">' + esc(meta.sector) + '</span></div>';
    if (meta.context) h += '<div class="muted" style="margin-top:4px;color:#4f46e5;font-style:italic">' + esc(meta.context) + '</div>';
    h += '<div class="stats" style="margin-top:12px">' + [[meta.ongoing, "Ongoing"], [meta.phase3, "Phase 3 ongoing"], [meta.deviationCount, "Flagged (dev 30+)"], [e.slippedPct == null ? "n/a" : e.slippedPct + "%", "Trials slipped 3+ mo"], [e.avgSlipMonths == null ? "n/a" : e.avgSlipMonths, "Avg slip, months"], [e.pulled || 0, "Pulled forward"], [e.endpointChanged || 0, "Endpoint changed mid-study"], [e.enrollUnder || 0, "Under-enrolled"], [e.enrollOver || 0, "Over-enrolled"], [meta.terminated12m, "Stopped 12m"], [e.overdue || 0, "Results overdue"], [meta.historyCoverage + "%", "History collected"]].map(function (s) { return '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join("") + '</div>';
    h += '<div class="muted" style="margin-top:10px">Execution stats compare each trial\'s current CT.gov record with its original registration. Generated ' + esc(d.generated.substring(0, 16).replace("T", " ")) + ' UTC.</div></div>';
    h += '<div class="toolbar">';
    h += '<select id="ds">' + [["ongoing", "Ongoing"], ["flagged", "Flagged only"], ["closed", "Completed / closed (12m)"], ["terminated", "Terminated / suspended"], ["all", "All"]].map(function (o) { return '<option value="' + o[0] + '"' + (dStatus === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join("") + '</select>';
    h += '<select id="dp"><option value="">All phases</option><option value="3"' + (dPhase === "3" ? ' selected' : '') + '>Phase 3</option><option value="2"' + (dPhase === "2" ? ' selected' : '') + '>Phase 2</option><option value="1"' + (dPhase === "1" ? ' selected' : '') + '>Phase 1</option><option value="na"' + (dPhase === "na" ? ' selected' : '') + '>N/A (device etc.)</option></select>';
    h += '<select id="dso">' + [["deviation", "Sort: deviation from plan"], ["importance", "Sort: importance"], ["pcd", "Sort: primary completion"], ["changed", "Sort: recently changed"]].map(function (o) { return '<option value="' + o[0] + '"' + (dSort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join("") + '</select>';
    h += '<span class="muted">' + rows.length + ' of ' + all.length + ' trials</span></div>';
    h += '<div style="margin-bottom:10px"><span class="chip' + (dArea === "" ? " on" : "") + '" data-a="">All areas</span>' + Object.keys(areas).sort(function (a, b) { return areas[b] - areas[a]; }).map(function (a) { return '<span class="chip' + (dArea === a ? " on" : "") + '" data-a="' + esc(a) + '">' + esc(a) + ' <span class="muted">' + areas[a] + '</span></span>'; }).join("") + '</div>';
    if (!rows.length) h += '<div class="empty">No trials match these filters.</div>';
    var lastArea = null;
    rows.forEach(function (r) { if (dSort === "importance" && !dArea && r.area !== lastArea) { h += '<h2>' + esc(r.area) + '</h2>'; lastArea = r.area; } h += trialCard(r); });
    main.innerHTML = h;
    document.getElementById("back").onclick = function (ev) { ev.preventDefault(); location.hash = "companies"; setView("companies"); render(); };
    document.getElementById("ds").onchange = function (ev) { dStatus = ev.target.value; renderCompany(d); };
    document.getElementById("dp").onchange = function (ev) { dPhase = ev.target.value; renderCompany(d); };
    document.getElementById("dso").onchange = function (ev) { dSort = ev.target.value; renderCompany(d); };
    main.querySelectorAll(".chip").forEach(function (c) { c.onclick = function () { dArea = c.dataset.a; renderCompany(d); }; });
  }
  function cell(a, b, kind) {
    // kind: "date" | "num"; returns [orig, current, delta html]
    if (a == null && b == null) return ["n/a", "n/a", ""];
    var o = kind === "date" ? mon(a) : num(a), c = kind === "date" ? mon(b) : num(b), delta = "";
    if (a != null && b != null && a !== b) {
      if (kind === "date") { var ma = /^(\d{4})-(\d{2})/.exec(a), mb = /^(\d{4})-(\d{2})/.exec(b); if (ma && mb) { var m = (+mb[1] - +ma[1]) * 12 + (+mb[2] - +ma[2]); delta = '<span class="' + (m > 0 ? 'd' : 'g') + '">' + (m > 0 ? '+' : '') + m + ' mo</span>'; } }
      else { var p = a ? Math.round((b - a) / a * 100) : 0; delta = '<span class="' + (p < 0 ? 'd' : 'g') + '">' + (p > 0 ? '+' : '') + p + '%</span>'; }
    }
    return [o, c, delta];
  }
  function trialCard(r) {
    var color = STATUS_COLOR[r.statusLabel] || "#6b7280", p = r.plan || {};
    var h = '<div class="trial" style="border-left-color:' + color + '">';
    h += '<div><a href="https://clinicaltrials.gov/study/' + esc(r.nct) + '" target="_blank" rel="noopener" style="font-family:ui-monospace,Menlo,monospace;font-weight:700">' + esc(r.nct) + '</a> ' + statusPill(r.statusLabel) + (r.phase ? pill(r.phase, "#6b7280") : "") + (r.themes && r.themes.length ? pill(r.themes[0], "#7c3aed") : "") + '<span class="score" style="float:right;color:' + devColor(r.deviation) + '">dev ' + r.deviation + ' <span class="muted">/ imp ' + r.importance + '</span></span></div>';
    h += '<div class="t">' + esc(r.title) + '</div>';
    h += '<div class="muted">' + esc((r.interventions || []).slice(0, 3).join(", ")) + (r.conditions && r.conditions.length ? ' &middot; ' + esc(r.conditions.slice(0, 3).join(", ")) : '') + '</div>';
    // plan vs actual grid
    var hasPlan = p.origPcd || p.origEnroll != null || p.origStart;
    if (hasPlan) {
      var s = cell(p.origStart, r.start, "date"), c = cell(p.origPcd, r.pcd, "date"), e = cell(p.origEnroll, r.enroll, "num");
      h += '<div class="pva"><div class="h"></div><div class="h">' + esc(p.historyPending ? "first seen" : "original") + '</div><div class="h">now</div><div class="h">delta</div>';
      h += '<div>Start</div><div>' + s[0] + '</div><div>' + s[1] + '</div><div>' + s[2] + '</div>';
      h += '<div>Primary completion</div><div>' + c[0] + '</div><div>' + c[1] + (r.pcdType === "ESTIMATED" ? ' <span class="muted">est</span>' : '') + '</div><div>' + c[2] + (p.pcdMoves ? ' <span class="muted">' + p.pcdMoves + ' moves</span>' : '') + '</div>';
      h += '<div>Enrollment</div><div>' + e[0] + '</div><div>' + e[1] + (r.enrollType === "ACTUAL" ? ' <span class="muted">actual</span>' : ' <span class="muted">target</span>') + '</div><div>' + e[2] + '</div>';
      if (p.plannedDurationMonths && p.currentDurationMonths) h += '<div>Duration</div><div>' + (p.plannedDurationMonths / 12).toFixed(1) + ' yrs</div><div>' + (p.currentDurationMonths / 12).toFixed(1) + ' yrs</div><div></div>';
      h += '</div>';
    }
    if (p.timeline && p.timeline.length) h += '<div class="tl">' + p.timeline.map(function (t) { return '<span>' + esc(mon(t.date)) + ' ' + esc(String(t.status).replace(/_/g, " ").toLowerCase()) + '</span>'; }).join('&rarr; ') + (p.versions ? '<span class="muted">(' + p.versions + ' record versions)</span>' : '') + '</div>';
    (r.signals || []).filter(function (s) { return s.severity !== "info"; }).forEach(function (s) { h += '<div class="sig ' + s.severity + '">' + sigPill(s) + '<b>' + esc(s.text) + '</b><span>' + esc(s.read) + '</span>' + (s.detail ? '<div class="muted" style="margin-top:3px">Original: ' + esc(s.detail.original) + '<br>Current: ' + esc(s.detail.current) + '</div>' : '') + '</div>'; });
    if (r.commentary) h += '<div class="c">' + esc(r.commentary) + '</div>';
    if (r.reasons && r.reasons.length) h += '<div class="r">Importance ' + r.importance + ': ' + esc(r.reasons.join("; ")) + '</div>';
    (r.changes || []).slice(0, 4).forEach(function (c) { h += '<div class="ch' + (/Results posted|pulled in/.test(c.text) ? ' g' : '') + '">' + esc(c.date) + ': ' + esc(c.text) + '</div>'; });
    h += '<div class="muted" style="margin-top:3px">Last CT.gov update ' + esc(r.lastUpdate || "") + (p.historyPending ? ' &middot; record history not yet collected' : '') + '</div></div>';
    return h;
  }

  // ---------------- Readouts ----------------
  function renderReadouts() {
    var h = '<div class="card"><b>Phase 2/3 trials with primary completion in the next 90 days</b><div class="muted">Sorted by primary completion, then importance. "Orig" is the date in the original registration; dates are sponsor estimates.</div></div>';
    h += '<table><thead><tr><th>Primary completion</th><th>Orig</th><th>Ticker</th><th>Trial</th><th>Phase</th><th>Status</th><th class="num">Patients</th><th>Area</th><th class="num">Imp</th></tr></thead><tbody>';
    IDX.readouts.forEach(function (r) { h += '<tr class="row" data-t="' + esc(r.ticker) + '"><td><b>' + mon(r.pcd) + '</b></td><td class="muted">' + (r.origPcd ? mon(r.origPcd) + (r.slip ? ' <span style="color:' + (r.slip > 0 ? '#b91c1c' : '#047857') + '">' + (r.slip > 0 ? '+' : '') + r.slip + '</span>' : '') : 'n/a') + '</td><td>' + tk(r.ticker, r.coverage) + '</td><td><a href="https://clinicaltrials.gov/study/' + esc(r.nct) + '" target="_blank" rel="noopener">' + esc(r.nct) + '</a> ' + esc(r.title) + '<div class="muted">' + esc(r.intervention) + '</div></td><td>' + esc(r.phase) + '</td><td>' + statusPill(r.status) + '</td><td class="num">' + num(r.enroll) + '</td><td class="muted">' + esc(r.area) + '</td><td class="num">' + r.importance + '</td></tr>'; });
    h += '</tbody></table>';
    if (!IDX.readouts.length) h += '<div class="empty">Nothing in the window.</div>';
    main.innerHTML = h;
    main.querySelectorAll("tr.row").forEach(function (tr) { tr.onclick = function (e) { if (e.target.tagName !== "A") openCompany(tr.dataset.t); }; });
  }

  // ---------------- Terminations ----------------
  function renderTerminations() {
    var h = '<div class="card"><b>Terminated, suspended and withdrawn trials, last 12 months</b><div class="muted">Reason classified from the sponsor\'s "why stopped" text. Enrolled vs original target shows how far the study got.</div></div>';
    h += '<table><thead><tr><th>Updated</th><th>Ticker</th><th>Trial</th><th>Phase</th><th>Status</th><th>Reason</th><th>Why stopped</th><th class="num">Enrolled / orig</th></tr></thead><tbody>';
    IDX.terminations.forEach(function (r) { var rc = (r.reason === "safety" || r.reason === "efficacy / futility" || r.reason === "unstated") ? "#b91c1c" : "#d97706"; h += '<tr class="row" data-t="' + esc(r.ticker) + '"><td>' + esc(r.lastUpdate) + '</td><td>' + tk(r.ticker, r.coverage) + '</td><td><a href="https://clinicaltrials.gov/study/' + esc(r.nct) + '" target="_blank" rel="noopener">' + esc(r.nct) + '</a> ' + esc(r.title) + '<div class="muted">' + esc(r.area) + '</div></td><td>' + esc(r.phase) + '</td><td>' + statusPill(r.status) + '</td><td>' + pill(r.reason || "n/a", rc) + '</td><td style="font-size:12px;color:#4b5563">' + esc(r.why) + '</td><td class="num">' + num(r.enroll) + (r.origEnroll != null ? ' <span class="muted">/ ' + num(r.origEnroll) + '</span>' : '') + '</td></tr>'; });
    h += '</tbody></table>';
    main.innerHTML = h;
    main.querySelectorAll("tr.row").forEach(function (tr) { tr.onclick = function (e) { if (e.target.tagName !== "A") openCompany(tr.dataset.t); }; });
  }

  // ---------------- Candidates ----------------
  function renderCandidates() {
    var h = '<div class="card"><b>Industry lead sponsors with no ticker mapping</b><div class="muted">Top 300 by ongoing trial count. Add public ones to PUBLIC_SPONSORS in tickers.js; mark private ones PRIVATE. Full list: <a href="data/pipeline/candidates.csv">candidates.csv</a>.</div></div>';
    h += '<table><thead><tr><th>Sponsor</th><th class="num">Ongoing</th><th class="num">Phase 3</th><th class="num">Total in scope</th></tr></thead><tbody>';
    IDX.candidates.forEach(function (c) { h += '<tr><td>' + esc(c.name) + '</td><td class="num">' + num(c.ongoing) + '</td><td class="num">' + num(c.p3) + '</td><td class="num">' + num(c.total) + '</td></tr>'; });
    main.innerHTML = h + '</tbody></table>';
  }

  // ---------------- Boot ----------------
  function route() {
    var hsh = (location.hash || "").replace("#", "");
    if (hsh.indexOf("c/") === 0) { openCompany(hsh.substring(2)); return; }
    if (["deviations", "companies", "readouts", "terminations", "candidates"].indexOf(hsh) !== -1) setView(hsh);
    render();
  }
  fetch(DATA + "index.json").then(function (r) { return r.json(); }).then(function (d) {
    IDX = d;
    document.getElementById("sub").textContent = num(d.stats.mappedCompanies) + " companies, " + num(d.stats.mappedTrials) + " trials, history on " + d.stats.historyCoveragePct + "%, built " + d.generated.substring(0, 10);
    route();
  }).catch(function () { main.innerHTML = '<div class="empty">No data yet. Run the "Build Pipeline Site Data" workflow in GitHub Actions, then refresh.</div>'; });
  window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
