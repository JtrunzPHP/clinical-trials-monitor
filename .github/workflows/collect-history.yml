name: Collect CT.gov Record History

on:
  schedule:
    # 2:00 AM ET during daylight time (06:00 UTC), before the site build at 09:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Trials to process this run'
        required: false
        default: '1500'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install headless Chrome
        run: npm install puppeteer@23.11.1 --no-save
      - name: Collect history
        env:
          HISTORY_BUDGET: ${{ github.event.inputs.budget || '1500' }}
          MAX_RUN_MINUTES: '300'
        run: node collect-history.js
      - name: Save history data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline/history
          git diff --staged --quiet || git commit -m "Update record history [skip ci]"
          git pull --rebase
          git push
