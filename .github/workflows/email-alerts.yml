name: Clinical Trials Daily Digest

on:
  schedule:
    # 7:00 AM ET (EDT=UTC-4 → 11:00 UTC; will be 8am during EST)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send daily digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: node send-report.js
      - name: Save dedup tracking file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-sent.json
          git diff --staged --quiet || git commit -m "Update last-sent.json [skip ci]"
          git push
