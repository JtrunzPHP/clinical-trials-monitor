name: Build Pipeline Site Data

on:
  schedule:
    # 5:00 AM ET during daylight time (09:00 UTC), two hours before the digest.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build pipeline data
        run: node build-pipeline.js
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline
          git diff --staged --quiet || git commit -m "Update pipeline data [skip ci]"
          git pull --rebase
          git push
